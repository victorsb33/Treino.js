<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Convertor em Dólar</h1>
    <input placeholder="Valor em Reais" type="number">
    <button onclick="converter()">Converter</button>
    
</body>

    <script>

        const valorEmReal = document.querySelector("input")

        function converter(){

            document.querySelector("h1").style.color = "red"
            const valorConvertido = valorEmReal.value / 5
            
            alert(`O valor do dolar é ${valorConvertido} dólares`)
        }

    </script>

</html>
